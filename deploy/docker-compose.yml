# Season Card — app + (optional) Caddy for automatic HTTPS.
# Managed by deploy/install.sh. Do not edit secrets here; they live in ../.env
name: seasoncard   # unique project name so it can never collide with other stacks on this server
services:
  app:
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: seasoncard:latest
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    volumes:
      - seasoncard-data:/data   # PayPal settings saved from /setup (survives rebuilds)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data

volumes:
  seasoncard-data:
