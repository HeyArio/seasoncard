# Season Card — app + (optional) Caddy for automatic HTTPS.
# Managed by deploy/install.sh. Do not edit secrets here; they live in ../.env
services:
  app:
    build: ..
    image: seasoncard:latest
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:3080:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
