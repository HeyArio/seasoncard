<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(../public/fonts/fraunces-latin-opsz-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Fraunces;font-style:italic;src:url(../public/fonts/fraunces-latin-opsz-italic.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Manrope;src:url(../public/fonts/manrope-latin-wght-normal.woff2) format("woff2");font-weight:200 800}
html,body{margin:0}
body{width:1200px;height:630px;background:#F5EFE6;font-family:Manrope;color:#211C18;display:flex;align-items:center;padding:0 80px;box-sizing:border-box;gap:64px}
.l{flex:1}
.brand{display:flex;align-items:center;gap:14px;font-family:Fraunces;font-weight:600;font-size:34px}
h1{font-family:Fraunces;font-weight:560;font-size:74px;line-height:1.02;letter-spacing:-.02em;margin:34px 0 26px}
p{font-size:28px;color:#5E544B;margin:0}
.pill{display:inline-block;margin-top:34px;background:#9A4A24;color:#fff;font-weight:700;font-size:26px;padding:18px 34px;border-radius:999px}
.card{width:360px;background:#FFFDF9;border:2px solid #E3D8CA;border-radius:32px;padding:30px;box-shadow:0 20px 50px rgba(33,28,24,.08)}
.k{font-size:15px;font-weight:700;letter-spacing:.1em;color:#5E544B}
.n{font-family:Fraunces;font-weight:600;font-size:44px;margin:10px 0 18px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw div{height:120px;border-radius:18px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.m div{background:#F5EFE6;border-radius:999px;text-align:center;padding:10px 0;font-weight:700;font-size:18px}
</style></head><body>
<div class="l">
  <div class="brand"><svg width="44" height="32" viewBox="0 0 30 22"><circle cx="8" cy="11" r="7.5" fill="#B5705A"/><circle cx="15" cy="11" r="7.5" fill="#8A8F5E" fill-opacity=".92"/><circle cx="22" cy="11" r="7.5" fill="#5F7F82" fill-opacity=".92"/></svg>Season Card</div>
  <h1>Find the colours that make your face glow.</h1>
  <p>One selfie by a window. Measured on your device.</p>
  <div class="pill">Take the free scan</div>
</div>
<div class="card">
  <div class="k">SEASON CARD · EXAMPLE</div>
  <div class="n">Soft Autumn</div>
  <div class="sw"><div style="background:#B5705A"></div><div style="background:#8A8F5E"></div><div style="background:#C9A27E"></div><div style="background:#5F7F82"></div></div>
  <div class="m"><div>Warm-neutral</div><div>Medium</div><div>Low</div><div>Soft</div></div>
</div>
</body></html>
